set -g prefix C-SPACE
set -sg escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g aggressive-resize on
set -g extended-keys on
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=color255,bg=default,bold"
set -g window-status-separator ""
set -g window-status-format "#[fg=color240]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=color240]#[default]"
set -g window-status-current-format "#[fg=color252]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=color252]#[default]"
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""

bind E show-environment -g
bind - split-window -c "#{pane_current_path}"
bind | split-window -hc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
