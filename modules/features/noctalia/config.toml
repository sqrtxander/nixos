[audio]
enable_screenshot_sounds = false

[bar.default]
end = [ "tray", "network", "bluetooth", "battery", "notifications" ]
margin_ends = 0
radius = 6
radius_top_left = 0
radius_top_right = 0
start = [ "workspaces" ]

[calendar]

[control_center]
hidden_tabs = [ "weather", "screen-time" ]

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 752.0
    cy = 821.0
    output = "eDP-1"
    placement_height = 1003.0
    placement_width = 1504.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.5

    [shell.launcher]
    search_position = "top"

    [shell.panel]
    control_center_placement = "floating"
    transparency_mode = "soft"

    [shell.screenshot]
    directory = "/home/xander/pictures/screenshots/"
    filename_pattern = "%Y-%m-%d-%H-%M-%S.png"

[theme]
mode = "dark"
shell_mode = "follow"
source = "custom"
theme.custom_palette = "custom"

    [theme.templates]
    enable_builtin_templates = false

[weather]
enabled = false

[widget.network]
show_label = false
