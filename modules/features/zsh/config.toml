version = 3
final_space = true

[secondary_prompt]
  template = '❯❯ '
  foreground = 'magenta'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

[[blocks.segments]] # Nix shell indicator
  type = 'text'
  style = 'plain'
  template = '{{ if and .Env.IN_NIX_SHELL (not .Env.DEVSHELL_NAME) }}<blue> nsh</> <white>|</> {{ end }}'

[[blocks.segments]]
  template = '{{ .Path }}'
  foreground = 'blue'
  background = 'transparent'
  type = 'path'
  style = 'plain'

  [blocks.segments.properties]
    cache_duration = 'none'
    style = 'full'

[[blocks.segments]]
  template = ' {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}<magenta> *</>{{ end }} <cyan>{{ if gt .Behind 0 }}󰁅{{ end }}{{ if gt .Ahead 0 }}{{ end }}</>'
  foreground = 'green'
  background = 'transparent'
  type = 'git'
  style = 'plain'

  [blocks.segments.properties]
    branch_icon = ''
    cache_duration = 'none'
    commit_icon = '@'
    fetch_status = true

[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    template = '{{ .FormattedMs }}'
    foreground = 'yellow'
    background = 'transparent'
    type = 'executiontime'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 5000

[[blocks]]
 type = 'prompt'
 alignment = 'left'
 newline = true

 [[blocks.segments]]
   template = '❯'
   background = 'transparent'
   type = 'text'
   style = 'plain'
   foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']

   [blocks.segments.properties]
     cache_duration = 'none'

